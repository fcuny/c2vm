name: kernel

on:
  push:
    branches:
      - main
    paths:
      - kernel/**
      # Not the kernel's: e.g. the default kernel job's PRs change the
      # README. The kernel-bot workflow tests bot.py.
      - '!kernel/README.md'
      - '!kernel/bot*.py'
      - '!kernel/test/**'
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - kernel/**
      - '!kernel/README.md'
      - '!kernel/bot*.py'
      - '!kernel/test/**'
      - .github/workflows/kernel.yml
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build
        run: kernel/run.sh kernel/build.sh out

      # Nothing else runs update.sh until there's a new release. On the
      # current one, with the same toolchain, it regenerates the same
      # config.
      - name: Check update.sh
        run: |
          kernel/run.sh kernel/update.sh "$(cat kernel/VERSION)"
          git diff --exit-code

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: out/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    # From main only: run by hand on another branch, the workflow builds
    # the kernel (see the artifact) without replacing the published one.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download the kernel
        uses: actions/download-artifact@v8
        with:
          name: kernel
          path: kernel/out

      - name: Compute tags
        id: version
        run: |
          echo "version=$(cat kernel/VERSION)" >> "$GITHUB_OUTPUT"
          echo "series=$(kernel/series.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: kernel
          file: kernel/Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/c2vm-kernel:${{ steps.version.outputs.series }}
            ghcr.io/${{ github.repository_owner }}/c2vm-kernel:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Linux ${{ steps.version.outputs.version }} guest kernel for c2vm
            org.opencontainers.image.licenses=GPL-2.0-only

  # After a new series is published from main, opens a draft PR that
  # makes it c2vm's default kernel. It uses KERNEL_BOT_TOKEN, like the
  # kernel-update workflow, so that the PR's checks run.
  default:
    name: Default kernel
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One at a time, as they push the same branches.
    concurrency:
      group: kernel-default
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open a PR
        env:
          GH_TOKEN: ${{ secrets.KERNEL_BOT_TOKEN }}
        run: python3 kernel/bot.py default
