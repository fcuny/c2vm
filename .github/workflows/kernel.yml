name: kernel

on:
  push:
    branches:
      - main
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev gcc-aarch64-linux-gnu

      - name: Build
        run: kernel/build.sh out

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: out/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download the kernel
        uses: actions/download-artifact@v8
        with:
          name: kernel
          path: kernel/out

      - name: Compute tags
        id: version
        run: |
          version=$(cat kernel/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: kernel
          file: kernel/Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/c2vm-kernel:${{ steps.version.outputs.series }}
            ghcr.io/${{ github.repository_owner }}/c2vm-kernel:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Linux ${{ steps.version.outputs.version }} guest kernel for c2vm
            org.opencontainers.image.licenses=GPL-2.0-only
