name: kernel

on:
  push:
    branches:
      - main
    paths:
      - kernel/**
      # Not the kernel's: e.g. the default kernel job's PRs change it.
      - '!kernel/README.md'
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - kernel/**
      - '!kernel/README.md'
      - .github/workflows/kernel.yml
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build
        run: kernel/run.sh kernel/build.sh out

      # Nothing else runs update.sh until there's a new release. On the
      # current one, with the same toolchain, it regenerates the same
      # config.
      - name: Check update.sh
        run: |
          kernel/run.sh kernel/update.sh "$(cat kernel/VERSION)"
          git diff --exit-code

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: out/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download the kernel
        uses: actions/download-artifact@v8
        with:
          name: kernel
          path: kernel/out

      - name: Compute tags
        id: version
        run: |
          echo "version=$(cat kernel/VERSION)" >> "$GITHUB_OUTPUT"
          echo "series=$(kernel/series.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: kernel
          file: kernel/Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/c2vm-kernel:${{ steps.version.outputs.series }}
            ghcr.io/${{ github.repository_owner }}/c2vm-kernel:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Linux ${{ steps.version.outputs.version }} guest kernel for c2vm
            org.opencontainers.image.licenses=GPL-2.0-only

  # After a new series is published from main, opens a draft PR that
  # makes it c2vm's default kernel. It uses KERNEL_BOT_TOKEN, like the
  # kernel-update workflow, so that the PR's checks run.
  default:
    name: Default kernel
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One at a time, as they push the same branches.
    concurrency:
      group: kernel-default
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open a PR
        env:
          GH_TOKEN: ${{ secrets.KERNEL_BOT_TOKEN }}
        run: |
          series=$(kernel/series.sh)
          current=$(grep -oE 'c2vm-kernel:[0-9]+\.[0-9]+"' cmd/c2vm/kernel.go | cut -d: -f2 | tr -d '"')
          if [[ -z $current ]]; then
            echo "can't find the default kernel's tag in cmd/c2vm/kernel.go" >&2
            exit 1
          fi
          if [[ $(printf '%s\n' "$current" "$series" | sort -V | tail -n 1) == "$current" ]]; then
            echo "the default kernel is :$current, which is :$series or newer"
            exit 0
          fi
          branch=c2vm/default-kernel-$series
          if [[ -n $(gh pr list --head "$branch" --state open --json number --jq '.[]') ]]; then
            echo "there's already a PR for :$series"
            exit 0
          fi

          # The tag, not a longer one that starts with it (e.g. 7.2.9):
          # it ends the line, or a sentence, or is followed by something
          # else than a digit or a dot.
          sed -i -E "s/c2vm-kernel:${current//./\\.}(\.?([^0-9.]|$))/c2vm-kernel:$series\1/g" \
            cmd/c2vm/kernel.go README.md kernel/README.md
          if git diff --quiet cmd/c2vm/kernel.go; then
            echo "didn't change the default kernel in cmd/c2vm/kernel.go" >&2
            exit 1
          fi

          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "c2vm: boot $series kernels by default"
          git push --force origin "$branch"
          # The marker tells this job's PRs from others.
          gh pr create --draft --base main --head "$branch" \
            --title "c2vm: boot $series kernels by default" \
            --body "<!-- kernel-default -->
          Moves the default kernel from \`:$current\` to \`:$series\`, which the kernel workflow just published. Before merging, run \`make e2e\`."

          # This supersedes the open PRs for older series.
          gh pr list --state open --limit 200 --json number,headRefName,body \
            --jq '.[] | select(.body | contains("<!-- kernel-default -->")) | "\(.number) \(.headRefName)"' \
            > "$RUNNER_TEMP/prs"
          while read -r pr head; do
            other=${head#c2vm/default-kernel-}
            if [[ $head == "$branch" || ! $other =~ ^[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if [[ $(printf '%s\n' "$other" "$series" | sort -V | tail -n 1) == "$series" ]]; then
              gh pr close "$pr" --delete-branch --comment "Superseded by :$series."
            fi
          done < "$RUNNER_TEMP/prs"
