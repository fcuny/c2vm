name: kernel-update

# Opens a draft PR that moves the guest kernel to a new release, with
# kernel/update.sh: the one it's given, or every day, kernel.org's latest
# stable release if it's newer than ours.
#
# It pushes and opens the PR with KERNEL_BOT_TOKEN, a fine-grained token
# for this repository with read and write access to contents and pull
# requests: what GITHUB_TOKEN pushes doesn't trigger workflows, and the
# PR needs the kernel workflow to build it.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "Kernel release, e.g. 7.3.1 (default: kernel.org's latest stable)"
        required: false

# One run at a time for each trigger. A run started while another one
# waits replaces it, which loses nothing: the newest release supersedes
# the older ones. A daily run doesn't replace one started by hand, which
# may be for an older release.
concurrency:
  group: kernel-update-${{ github.event_name }}

permissions:
  contents: read

jobs:
  update:
    name: Update
    # run.sh's container is arm64.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        # With pipefail, which the default shell doesn't set.
        shell: bash
    env:
      REQUESTED: ${{ inputs.version }}
    steps:
      # The PR is against main, so start from it, whichever branch this
      # runs from. The token isn't kept in .git/config: run.sh mounts the
      # checkout in its container, where the kernel's scripts run. Only
      # the steps that need it get it.
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check the version
        id: check
        env:
          GH_TOKEN: ${{ secrets.KERNEL_BOT_TOKEN }}
        run: python3 kernel/bot.py update-check "$REQUESTED"

      # The changes go in the checkout, which is all run.sh's container
      # sees; only kernel/ is committed.
      - name: Update
        if: steps.check.outputs.skip != 'true'
        run: kernel/run.sh kernel/update.sh "$VERSION" changes.txt

      - name: Open a PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.KERNEL_BOT_TOKEN }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: python3 kernel/bot.py update-pr "$CURRENT" changes.txt
