name: go

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: Go vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      - name: Build
        run: go build -v ./cmd/...

  macos:
    name: macOS
    # Apple silicon. GitHub's macOS runners can't run VMs themselves (no
    # nested virtualization), so this builds and tests c2vm, including
    # the Virtualization.framework backend, without booting anything.
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      - name: Build and sign
        run: |
          make build
          codesign -d --entitlements - c2vm | grep -q com.apple.security.virtualization

      # The steps above build without the embedinit tag, which needs the
      # init make build just built.
      - name: Go vet and test, with the init embedded
        run: |
          go vet -tags embedinit ./...
          go test -tags embedinit -run TestEmbeddedInit -v ./cmd/c2vm
